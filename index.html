<!DOCTYPE html>
<html>
<head>
  <title>Space Adventure</title>
  <style>
    /* CSS Styling (game.css) */
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(to bottom, #0a0e27, #16213e);
  font-family: 'Arial', sans-serif;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#start-screen {
  text-align: center;
}

.game-title {
  font-size: 60px;
  color: #00ff00;
  text-shadow: 0 0 20px #00ff00;
  margin-bottom: 10px;
  letter-spacing: 5px;
}

.tagline {
  font-size: 20px;
  color: #4ecca3;
  margin-bottom: 40px;
}

.button-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
  margin-bottom: 30px;
}

.game-btn {
  width: 250px;
  padding: 15px 30px;
  font-size: 20px;
  font-weight: bold;
  border: 3px solid;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background-color: #4ecca3;
  border-color: #4ecca3;
  color: #0a0e27;
}

.btn-primary:hover {
  background-color: #00ff00;
  transform: scale(1.05);
  box-shadow: 0 0 20px #4ecca3;
}

.btn-secondary {
  background-color: transparent;
  border-color: #4ecca3;
  color: #4ecca3;
}

.btn-secondary:hover {
  background-color: #4ecca3;
  color: #0a0e27;
}

.stats {
  color: #ffd700;
  font-size: 18px;
}

#gameCanvas {
  border: 3px solid #4ecca3;
  box-shadow: 0 0 30px rgba(78, 204, 163, 0.5);
}

/* Try adding:
   - Animations
   - More buttons
   - Score display
   - Lives indicator
*/
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1 class="game-title">SPACE ADVENTURE</h1>
    <p class="tagline">Defend Earth from Alien Invaders!</p>
    
    <div class="button-container">
      <button id="startBtn" class="game-btn btn-primary">
        Start Game
      </button>
      <button id="instructionsBtn" class="game-btn btn-secondary">
        Instructions
      </button>
    </div>
    
    <div class="stats">
      <span class="stat-item">High Score: <span id="highScore">0</span></span>
    </div>
  </div>

  <!-- Game Canvas (hidden initially) -->
  <canvas id="gameCanvas" style="display: none;"></canvas>
</body>
</html>
